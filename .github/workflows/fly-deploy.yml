name: Fly Deploy
on:
  push:
    branches:
      - main
    # Notes and the docs' pictures: no check reads them and the image never carries them.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: # allow manual deploys from the Actions tab

permissions:
  contents: read

# Main runs queue in order and are never cut off; a newer PR push replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tagging the image with its commit is how the next run knows what is live.
  IMAGE_LABEL: sha-${{ github.sha }}

jobs:
  # One runner for both: Fly's builder builds the image while this one's cores run the checks.
  check:
    name: Checks and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the last green run is read from this workflow's own history
    outputs:
      release: ${{ steps.live.outputs.release }}
      backup: ${{ steps.live.outputs.backup }}
    steps:
      # Whole history for the two diffs below, and no token left in the folder the checks are copied from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Measured from the last commit that passed, so a red run is never skipped over.
      - name: Which checks does this change need?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/changed-since-green.sh
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: github.event_name != 'pull_request'
      # Compared with what is live, so a failed or superseded run is never skipped over.
      - name: Has anything that ships changed?
        id: live
        if: github.event_name != 'pull_request'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash .github/scripts/changed-since-live.sh
      # Started before Node is set up, so the builder has its head start on the checks.
      - name: Start the image build behind the checks
        if: steps.live.outputs.release == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash .github/scripts/image-in-background.sh start
      # Only a plain "false" skips a step below: a missing answer runs the check.
      - uses: actions/setup-node@v7
        id: node
        if: steps.changed.outputs.any != 'false'
        with:
          node-version: 22
      # Keyed on the manifest and the lockfile, so an install runs only when a dependency changed.
      - uses: actions/cache@v6
        id: modules
        if: steps.changed.outputs.any != 'false'
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
      # Scripts off, as in the image: no package's own code runs as the user this job's token belongs to.
      - run: npm ci --ignore-scripts
        if: steps.changed.outputs.any != 'false' && steps.modules.outputs.cache-hit != 'true'
      # The packages run as a user who cannot sudo, so Fly's token above stays out of their reach.
      - name: Format, lint, types, dead code and tests
        if: steps.changed.outputs.any != 'false'
        env:
          CODE: ${{ steps.changed.outputs.code }}
          APP: ${{ steps.changed.outputs.app }}
          SANDBOX_ENV: CODE APP
        run: bash .github/scripts/sandbox.sh checks.sh
      # Last, so the job fails on a broken image as the build job used to.
      - name: The image built
        if: steps.live.outputs.release == 'true'
        run: bash .github/scripts/image-in-background.sh wait

  # Names the release too: a job of its own started a runner for twenty seconds of work.
  deploy:
    name: Release and name it
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the GitHub release; the default token is read-only
      copilot-requests: write # Copilot words the description, billed to the owner's seat
    steps:
      # No token is left in the folder: this job's can write to the repository.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # A schema change here means wiping the file, so a release that can touch the volume gets a way back.
      - name: Back up the database
        # Skipped, secrets unread, unless the volume can change; only a plain "false" skips it.
        if: needs.check.outputs.backup != 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # The script stops the job on any failure, so nothing is released without a copy that opens.
        run: bash .github/scripts/backup-db.sh "pre-release-${GITHUB_SHA::7}"
      - run: flyctl deploy --image "registry.fly.io/innospace-scheduler:$IMAGE_LABEL" --ha=false --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Straight to the origin: the edge would answer with its copy of the old build.
      - name: Smoke test the new release
        run: curl --fail -sS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -w 'origin answered %{http_code} in %{time_total}s\n' https://innospace-scheduler.fly.dev/

      # The edge's copy of the booking page would otherwise outlive the release by minutes.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/purge-cache.sh

      # After the smoke test and the purge, so a tag marks a live build; a re-run claims the same episode.
      - name: Ask couch-gag for this release's episode
        id: episode
        env:
          COUCH_GAG_URL: ${{ vars.COUCH_GAG_URL }}
          COUCH_GAG_KEY: ${{ secrets.COUCH_GAG_KEY }}
        run: bash .github/scripts/release-name.sh

      # Copilot words the description from the commits since the last release, on the owner's seat.
      - name: Ask Copilot for the description
        # A release Copilot could not describe still gets GitHub's own list, so this step may fail.
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          # Pinned because it runs with this job's token.
          COPILOT_CLI: "1.0.114"
          RULES: >-
            Write the description of a GitHub release from the commits and changed files below.
            Answer with GitHub Markdown only, with no preamble and no closing remark.
            Start with one or two plain sentences on what this release changes for the people who use the app.
            Then list the notable changes as short bullets under "### Changes",
            and only where there are any under "### Fixes" and "### Internal".
            Describe only what the commits and files show and never invent a change.
            Use plain hyphens, never an em dash or an en dash.
            Do not use tools: everything you need is below. Keep it under 200 words.
        run: bash .github/scripts/release-notes.sh

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          TITLE: ${{ steps.episode.outputs.title }}
        run: bash .github/scripts/release-create.sh
