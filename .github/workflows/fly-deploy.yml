# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch: # allow manual deploys from the Actions tab
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        # fly.toml is gitignored (config lives in `fly secrets`); the committed
        # fly.toml.example carries the non-secret app config CI deploys with.
      - run: flyctl deploy --remote-only --ha=false --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Cloudflare caches the booking shell at the edge, so a deploy that does not
      # purge leaves visitors on the previous build. Purges that one URL rather
      # than the whole zone: innospacetirana.com is shared with the marketing
      # site, and purge_everything would make it pay a cold start on our deploys.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN not set, skipping purge."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://scheduler.innospacetirana.com/"]}'
