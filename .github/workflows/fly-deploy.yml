name: Fly Deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allow manual deploys from the Actions tab

permissions:
  contents: read

# Main runs queue in push order and are never cut off mid-release; a newer push to a PR replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tagging the image with its commit is how the next run knows what is live.
  IMAGE_LABEL: sha-${{ github.sha }}

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run knip
      - run: npm run test

  # Runs beside the checks, not after them, so the gate adds no time to a deploy.
  build:
    name: Build image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.live.outputs.release }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff below needs the commit that is live
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # Compared with what is live, not with the previous push, so a failed or superseded run is never skipped over.
      - name: Has anything that ships changed?
        id: live
        run: |
          live=$(flyctl image show --config fly.toml.example --json | jq -r '.[0].Tag // empty' | sed -n 's/^sha-//p')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$live" ] &&
            git diff --quiet "$live" HEAD -- . ':!tests' ':!docs' ':!.github' ':!*.md' ':!vitest.config.mts'; then
            echo "::notice::Nothing in the image changed since $live, so there is nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # fly.toml is gitignored, so CI uses the committed template.
      # Fly's remote builder sometimes drops the connection mid-build; only that is retried, a real build error fails at once.
      - name: Build and push
        if: steps.live.outputs.release == 'true'
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            flyctl deploy --build-only --push --remote-only --image-label "$IMAGE_LABEL" --config fly.toml.example 2>&1 | tee build.log && exit 0
            grep -qE 'rpc error: code = Unavailable|error reading from server: EOF' build.log || exit 1
            echo "::warning::The builder dropped the connection (attempt $attempt of 3), retrying."
            sleep 20
          done
          exit 1

  deploy:
    name: Release
    needs: [check, build]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --image "registry.fly.io/innospace-scheduler:$IMAGE_LABEL" --ha=false --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Straight to the origin: through Cloudflare the edge would answer with its copy of the old build.
      - name: Smoke test the new release
        run: |
          curl --fail -sS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 \
            -w 'origin answered %{http_code} in %{time_total}s\n' https://innospace-scheduler.fly.dev/

      # One URL, not the zone: innospacetirana.com is shared with the marketing site.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN not set, skipping purge."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://scheduler.innospacetirana.com/"]}'

  # Runs only after a release that passed its smoke test and its purge, so a tag always marks a build visitors received.
  release:
    name: Name the release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the default token is read-only
    steps:
      # couch-gag gives the same episode for the same commit, so a re-run uses no new one.
      - name: Ask couch-gag for this release's episode
        id: episode
        env:
          COUCH_GAG_URL: ${{ vars.COUCH_GAG_URL }}
          COUCH_GAG_KEY: ${{ secrets.COUCH_GAG_KEY }}
        run: |
          body=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_SHA" '{repo: $repo, ref: $ref}')
          release=$(curl --fail-with-body -sS --retry 4 --retry-all-errors --max-time 20 \
            -H "Authorization: Bearer $COUCH_GAG_KEY" -H "Content-Type: application/json" \
            -d "$body" "$COUCH_GAG_URL/v1/releases")
          tag=$(jq -r '"r\(.sequence)-\(.slug)"' <<<"$release")
          if ! [[ "$tag" =~ ^r[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::couch-gag answered something that is not a release: $release"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.name' <<<"$release")" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          TITLE: ${{ steps.episode.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TITLE" --generate-notes
          fi
